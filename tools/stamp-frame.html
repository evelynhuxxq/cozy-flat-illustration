<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stamp Frame</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#e9e6df;color:#22201c;
 font:14px/1.55 -apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.top{padding:22px 26px 16px;border-bottom:1px solid #d6d2c8}
h1{margin:0 0 4px;font-size:17px;font-weight:600}
.hint{font-size:13px;color:#6f695e}
.main{display:flex;gap:26px;padding:24px 26px 60px;align-items:flex-start;flex-wrap:wrap}
.panel{width:290px;flex:none}
.stage{flex:1;min-width:320px;background:#dedbd3;border-radius:4px;padding:26px;
 display:flex;justify-content:center;align-items:flex-start}
canvas{max-width:100%;height:auto;box-shadow:0 10px 30px rgba(0,0,0,.2);display:block}
label{display:block;font-size:12px;letter-spacing:.04em;color:#6f695e;margin:16px 0 5px}
input[type=text],input[type=number],select{width:100%;padding:7px 9px;border:1px solid #cdc8bc;
 border-radius:3px;background:#fdfcf8;font:inherit;font-size:13px;color:#22201c}
input[type=range]{width:100%}
.row{display:flex;gap:8px}
.row>*{flex:1}
.drop{border:1.5px dashed #b9b3a6;border-radius:4px;padding:20px 12px;text-align:center;
 font-size:13px;color:#6f695e;background:#f2efe8;cursor:pointer}
.drop.on{border-color:#2f5d4f;background:#e8f0ec}
.swatches{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:3px;border:1px solid rgba(0,0,0,.15);cursor:pointer}
.sw.sel{outline:2px solid #22201c;outline-offset:1px}
button{width:100%;margin-top:22px;padding:11px;border:0;border-radius:3px;background:#2f5d4f;
 color:#fff;font:inherit;font-weight:600;letter-spacing:.04em;cursor:pointer}
button:hover{background:#264c41}
.small{font-size:12px;color:#857f73;margin-top:10px;line-height:1.6}
.chk{display:flex;align-items:center;gap:7px;margin-top:14px;font-size:13px;color:#4a463e}
.chk input{margin:0}
</style></head><body>

<div class="top">
  <h1>Stamp Frame</h1>
  <div class="hint">Output dimensions match the source image exactly, so it pairs cleanly with the original.</div>
</div>

<div class="main">
<div class="panel">
  <div class="drop" id="drop">Click or drop an image</div>
  <input type="file" id="file" accept="image/*" hidden>

  <label>Place (large)</label>
  <input type="text" id="place" value="PUGET SOUND">

  <label>Subline (small)</label>
  <input type="text" id="sub" value="WASHINGTON · 2025">

  <label>Denomination</label>
  <input type="text" id="val" value="45">

  <label>Accent color</label>
  <div class="row"><input type="color" id="col" value="#2f5d4f" style="height:34px;padding:2px"></div>
  <div class="swatches" id="sw"></div>
  <div class="small">Swatches are sampled from your image. Click one to use it.</div>

  <label>Paper color</label>
  <div class="row"><input type="color" id="paper" value="#fdfbf4" style="height:34px;padding:2px"></div>

  <label>Margin <span id="mv">4.0</span>%</label>
  <input type="range" id="margin" min="2" max="8" step="0.2" value="4">

  <label>Perforation size <span id="rv">1.35</span>%</label>
  <input type="range" id="hole" min="0.8" max="2.2" step="0.05" value="1.35">

  <div class="chk"><input type="checkbox" id="trans"><label for="trans" style="margin:0">Transparent outside perforations</label></div>

  <button id="dl">Export PNG</button>
  <div class="small">If the button does nothing, right-click the preview and save the image.</div>
</div>

<div class="stage"><canvas id="cv"></canvas></div>
</div>

<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let img=new Image();
const $=id=>document.getElementById(id);

function tracked(t,x,y,sp,align){
  const w=[...t].reduce((a,c)=>a+ctx.measureText(c).width+sp,0)-sp;
  let cx = align==='right'? x-w : x;
  for(const c of t){ ctx.fillText(c,cx,y); cx+=ctx.measureText(c).width+sp; }
  return w;
}

function stampPath(W,H,r){
  const nx=Math.max(6,Math.round(W/(3.05*r))), ny=Math.max(5,Math.round(H/(3.05*r)));
  const sx=W/nx, sy=H/ny;
  ctx.beginPath(); ctx.moveTo(0,0);
  for(let i=0;i<nx;i++){const c=(i+.5)*sx; ctx.lineTo(c-r,0); ctx.arc(c,0,r,Math.PI,0,true);} ctx.lineTo(W,0);
  for(let i=0;i<ny;i++){const c=(i+.5)*sy; ctx.lineTo(W,c-r); ctx.arc(W,c,r,-Math.PI/2,Math.PI/2,true);} ctx.lineTo(W,H);
  for(let i=nx-1;i>=0;i--){const c=(i+.5)*sx; ctx.lineTo(c+r,H); ctx.arc(c,H,r,0,Math.PI,true);} ctx.lineTo(0,H);
  for(let i=ny-1;i>=0;i--){const c=(i+.5)*sy; ctx.lineTo(0,c+r); ctx.arc(0,c,r,Math.PI/2,-Math.PI/2,true);}
  ctx.closePath();
}

function render(){
  if(!img.width) return;
  const W=img.width, H=img.height, S=Math.min(W,H);
  cv.width=W; cv.height=H;
  ctx.clearRect(0,0,W,H);

  if(!$('trans').checked){ ctx.fillStyle='#e9e6df'; ctx.fillRect(0,0,W,H); }

  const r=S*parseFloat($('hole').value)/100;
  stampPath(W,H,r);
  ctx.save(); ctx.fillStyle=$('paper').value; ctx.fill(); ctx.clip();

  const m=S*parseFloat($('margin').value)/100;
  const band=m*2.05;                       // caption band
  const ix=m, iy=m, iw=W-2*m, ih=H-m-band;

  // cover crop
  const sc=Math.max(iw/W,ih/H), dw=W*sc, dh=H*sc;
  ctx.save(); ctx.beginPath(); ctx.rect(ix,iy,iw,ih); ctx.clip();
  ctx.drawImage(img, ix+(iw-dw)/2, iy+(ih-dh)/2, dw, dh); ctx.restore();

  ctx.strokeStyle='rgba(0,0,0,.16)'; ctx.lineWidth=Math.max(1,S*.0018);
  ctx.strokeRect(ix,iy,iw,ih);

  const col=$('col').value, by=iy+ih;
  ctx.textBaseline='alphabetic'; ctx.fillStyle=col;
  ctx.font=`${(band*.42).toFixed(1)}px Georgia,"Songti SC",serif`;
  tracked($('place').value, ix, by+band*.52, band*.055,'left');
  ctx.fillStyle='#8a857a';
  ctx.font=`${(band*.21).toFixed(1)}px -apple-system,"PingFang SC",sans-serif`;
  tracked($('sub').value, ix, by+band*.80, band*.07,'left');
  ctx.fillStyle=col;
  ctx.font=`${(band*.62).toFixed(1)}px Georgia,"Songti SC",serif`;
  const v=$('val').value; ctx.fillText(v, ix+iw-ctx.measureText(v).width, by+band*.68);

  ctx.restore();
}

// sample accent colors from the image
function palette(){
  const c=document.createElement('canvas'); c.width=60; c.height=60;
  const x=c.getContext('2d'); x.drawImage(img,0,0,60,60);
  const d=x.getImageData(0,0,60,60).data, buck={};
  for(let i=0;i<d.length;i+=4){
    const R=d[i],G=d[i+1],B=d[i+2];
    const mx=Math.max(R,G,B), mn=Math.min(R,G,B);
    if(mx-mn<28||mx>238||mx<32) continue;
    const k=`${R>>5},${G>>5},${B>>5}`; (buck[k]=buck[k]||[0,0,0,0]);
    buck[k][0]+=R; buck[k][1]+=G; buck[k][2]+=B; buck[k][3]++;
  }
  const top=Object.values(buck).sort((a,b)=>b[3]-a[3]).slice(0,6);
  const el=$('sw'); el.innerHTML='';
  top.forEach(t=>{
    let [R,G,B]=[t[0]/t[3],t[1]/t[3],t[2]/t[3]].map(v=>Math.round(v*.62)); // darken
    const hex='#'+[R,G,B].map(v=>v.toString(16).padStart(2,'0')).join('');
    const d2=document.createElement('div'); d2.className='sw'; d2.style.background=hex;
    d2.onclick=()=>{$('col').value=hex; [...el.children].forEach(n=>n.classList.remove('sel'));
      d2.classList.add('sel'); render();};
    el.appendChild(d2);
  });
}

function load(src){ img=new Image(); img.onload=()=>{palette();render();}; img.src=src; }

$('drop').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0]; if(f){const rd=new FileReader();
  rd.onload=ev=>load(ev.target.result); rd.readAsDataURL(f);}};
['dragover','dragleave','drop'].forEach(t=>$('drop').addEventListener(t,e=>{
  e.preventDefault(); $('drop').classList.toggle('on',t==='dragover');
  if(t==='drop'&&e.dataTransfer.files[0]){const rd=new FileReader();
    rd.onload=ev=>load(ev.target.result); rd.readAsDataURL(e.dataTransfer.files[0]);}}));
['place','sub','val','col','paper','trans'].forEach(id=>$(id).oninput=render);
$('margin').oninput=()=>{$('mv').textContent=(+$('margin').value).toFixed(1);render();};
$('hole').oninput=()=>{$('rv').textContent=(+$('hole').value).toFixed(2);render();};
$('dl').onclick=()=>cv.toBlob(b=>{const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download='stamp.png'; a.click();});

// empty state
ctx.canvas.width=900; ctx.canvas.height=560;
ctx.fillStyle='#f2efe8'; ctx.fillRect(0,0,900,560);
ctx.fillStyle='#a9a294'; ctx.textAlign='center';
ctx.font='16px -apple-system,sans-serif';
ctx.fillText('Drop an image to begin', 450, 285); ctx.textAlign='left';

</script></body></html>
